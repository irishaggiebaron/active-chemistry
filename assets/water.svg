<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
  <title>Water — H₂O</title>
  <desc>Water — H₂O. Bonds are lines; paired dots are lone pairs. </desc>
  <rect x="0" y="0" width="800" height="520" fill="white"/>
  <text x="400" y="44" font-size="25" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">Water — H₂O</text>
  <text x="400" y="78" font-size="16" text-anchor="middle" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">Lewis electron structure · 2D connectivity, not a 3D shape</text>
  <g transform="translate(80,45) scale(0.8)">
    <line x1="380.3123749748104" y1="270.40770654145274" x2="304.6876250251896" y2="329.59229345854726" stroke="#15202b" stroke-width="3" stroke-linecap="round"/>
    <line x1="419.6876250251896" y1="270.40770654145274" x2="495.3123749748104" y2="329.59229345854726" stroke="#15202b" stroke-width="3" stroke-linecap="round"/>
    <text x="400" y="266" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">O</text>
    <circle cx="374.1083351972153" cy="226.74010449877355" r="3.8" fill="#15202b"/>
    <circle cx="382.2998556401052" cy="221.0043401352631" r="3.8" fill="#15202b"/>
    <circle cx="417.7001443598948" cy="221.0043401352631" r="3.8" fill="#15202b"/>
    <circle cx="425.8916648027847" cy="226.74010449877355" r="3.8" fill="#15202b"/>
    <text x="285" y="356" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">H</text>
    <text x="515" y="356" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">H</text>
  </g>
  <text x="400" y="486" font-size="16" text-anchor="middle" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">8 valence electrons · lines = shared pairs · dots = nonbonding electrons</text>
</svg>
