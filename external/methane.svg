<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
  <title>Methane — CH₄</title>
  <desc>Methane — CH₄. Bonds are lines; paired dots are lone pairs. </desc>
  <rect x="0" y="0" width="800" height="520" fill="white"/>
  <text x="400" y="44" font-size="25" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">Methane — CH₄</text>
  <text x="400" y="78" font-size="16" text-anchor="middle" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">Lewis electron structure · 2D connectivity, not a 3D shape</text>
  <g transform="translate(80,45) scale(0.8)">
    <line x1="425.0" y1="280.0" x2="525.0" y2="280.0" stroke="#15202b" stroke-width="3" stroke-linecap="round"/>
    <line x1="400.0" y1="305.0" x2="400.0" y2="405.0" stroke="#15202b" stroke-width="3" stroke-linecap="round"/>
    <line x1="375.0" y1="280.0" x2="275.0" y2="280.0" stroke="#15202b" stroke-width="3" stroke-linecap="round"/>
    <line x1="400.0" y1="255.0" x2="400.0" y2="155.0" stroke="#15202b" stroke-width="3" stroke-linecap="round"/>
    <text x="400" y="291" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">C</text>
    <text x="550.0" y="291.0" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">H</text>
    <text x="400.0" y="441.0" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">H</text>
    <text x="250.0" y="291.0" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">H</text>
    <text x="400.0" y="141.0" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">H</text>
  </g>
  <text x="400" y="486" font-size="16" text-anchor="middle" fill="#52606d" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">8 valence electrons · lines = shared pairs · dots = nonbonding electrons</text>
</svg>
