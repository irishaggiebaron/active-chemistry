<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img">
  <title>Helium atom: Lewis symbol</title>
  <desc>Helium atom: Lewis symbol. Bonds are lines; paired dots are lone pairs. Two valence electrons fill the first shell.</desc>
  <rect x="0" y="0" width="800" height="520" fill="white"/>
  <g transform="translate(80,45) scale(0.8)">
    <text x="400" y="291" font-size="34" text-anchor="middle" fill="#15202b" font-family="DejaVu Sans, Arial, sans-serif" font-weight="normal">He</text>
    <circle cx="443.0" cy="275.0" r="3.8" fill="#15202b"/>
    <circle cx="443.0" cy="285.0" r="3.8" fill="#15202b"/>
  </g>
  </svg>
